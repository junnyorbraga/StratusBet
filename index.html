<!DOCTYPE html>

<!-- Define que o documento usa HTML5 -->
<html lang="pt-BR">

<head>

    <!-- Define caracteres especiais -->
    <meta charset="UTF-8">

    <!-- Responsividade para celular -->
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <!-- Título da aba -->
    <title>MEGA WIN</title>

    <!-- Importa o CSS externo -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ===================================== -->
<!-- ÁUDIOS DO JOGO -->
<!-- ===================================== -->

<!-- Som de girar -->
<audio id="spinSound"
src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3">
</audio>

<!-- Som de vitória -->
<audio id="winSound"
src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3">
</audio>

<!-- Som de jackpot -->
<audio id="jackpotSound"
src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3">
</audio>

<!-- Som de derrota -->
<audio id="loseSound"
src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3">
</audio>

<!-- ===================================== -->
<!-- TELA PRINCIPAL DO JOGO -->
<!-- ===================================== -->

<div class="container" id="gameScreen">

    <!-- Título principal -->
    <h1>🎰 MEGA WIN</h1>

    <!-- Texto abaixo do título -->
    <div class="subtitle">

        Você recebeu <b>100 moedas grátis</b><br>
        Tente sua sorte agora!

    </div>

    <!-- Caixa das moedas -->
    <div class="coins-box">

        <!-- Quantidade de moedas -->
        <div class="coins" id="coins">
            100
        </div>

        <!-- Texto auxiliar -->
        <div class="label">
            MOEDAS
        </div>

    </div>

    <!-- Área dos slots -->
    <div class="slot">

        <!-- Slot 1 -->
        <div class="reel" id="r1">❔</div>

        <!-- Slot 2 -->
        <div class="reel" id="r2">❔</div>

        <!-- Slot 3 -->
        <div class="reel" id="r3">❔</div>

    </div>

    <!-- Botão -->
    <button onclick="play()" id="playBtn">
        JOGAR AGORA
    </button>

    <!-- Área de mensagens -->
    <div class="message" id="message"></div>

</div>

<!-- ===================================== -->
<!-- TELA FINAL -->
<!-- ===================================== -->

<div id="warningScreen">

    <!-- Imagem final -->
    <img
    src="final.png"
    alt="Tela Final">

</div>

<!-- Importa o JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="script.js"></script>

</body>
</html>
