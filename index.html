<!DOCTYPE html>

<!-- Define que o documento usa HTML5 -->
<html lang="pt-BR">

<head>

    <!-- Define caracteres especiais -->
    <meta charset="UTF-8">

    <!-- Responsividade para celular -->
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <!-- Título da aba -->
    <title>STRATUS BET</title>

    <!-- Importa o CSS externo -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ===================================== -->
<!-- ÁUDIOS DO JOGO -->
<!-- ===================================== -->

<!-- Música ambiente -->
<audio
id="bgMusic"
loop
autoplay> <!--Inicia a musica-->

<source
src="musicaJogo.mp3"
type="audio/mpeg">

</audio>

<!-- Som moedas -->
<audio
id="coinLoop"
loop>
<source
src="https://assets.mixkit.co/active_storage/sfx/1991/1991-preview.mp3"
type="audio/mpeg">
</audio>

<!-- Som de girar -->
<audio id="spinSound"
src="https://assets.mixkit.co/active_storage/sfx/1084/1084-preview.mp3">
</audio>

<!-- Som de vitória -->
<audio id="winSound"
src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3">
</audio>

<!-- Som de jackpot -->
<audio id="jackpotSound"
src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3">
</audio>

<!-- Som de derrota -->
<audio id="loseSound"
src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3">
</audio>

<!-- Som game over -->
<audio id="gameOverSound"
src="https://assets.mixkit.co/active_storage/sfx/471/471-preview.mp3">
</audio>


<!-- ===================================== -->
<!-- TELA PRINCIPAL DO JOGO -->
<!-- ===================================== -->

<div class="container" id="gameScreen">

    <!-- Título principal -->
    <div class="logo-container">

    <img
    src="logo.png"
    alt="$tratus Bet"
    class="logo">

    </div>

    <!-- Texto abaixo do título -->
    <div class="subtitle">

        Crédito Promocional Ativado!<br>
        <span class="bonus">+100 moedas</span> foram adicionadas à sua conta.<br>
        Faça sua primeira rodada!

    </div>

    <!-- Caixa das moedas -->
    <div class="coins-box">

        <!-- Quantidade de moedas -->
        <div class="coins" id="coins">
            100
        </div>

        <!-- Texto auxiliar -->
        <div class="label">
            MOEDAS
        </div>

    </div>

    <!-- Área dos slots -->
    <div class="slot">

        <!-- Slot 1 -->
        <div class="reel" id="r1">❔</div>

        <!-- Slot 2 -->
        <div class="reel" id="r2">❔</div>

        <!-- Slot 3 -->
        <div class="reel" id="r3">❔</div>

    </div>

    <!-- Botão -->
    <button onclick="play()" id="playBtn">
        JOGAR AGORA
    </button>

    <!-- Área de mensagens -->
    <div class="message" id="message"></div>

</div>

<!-- TELAS -->

<!-- Tela final -->
<div id="warningScreen">

    <img
    src="final.png"
    alt="Tela Final">

</div>

<!-- Tela dívida -->
<div id="debtScreen">

    <img
    src="divida.png"
    class="debt-image"
    alt="Tela de dívida">

    <button
    class="retry-btn"
    onclick="restartGame()">

     JOGAR NOVAMENTE

    </button>

</div>

<!-- Importa o JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="script.js"></script>

</body>
</html>
